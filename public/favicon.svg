<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#14182e" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Tech Violet Gradient -->
    <linearGradient id="tsViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Golden Thread Gradient -->
    <linearGradient id="tsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="tsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="tsRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="tsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Golden Glow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tsBg)" stroke="url(#tsRim)" stroke-width="2.5" filter="url(#tsShadow)" />

  <!-- Tailor Seam / Stitch Inset -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="none" stroke="url(#tsGold)" stroke-width="1.5" stroke-dasharray="4 3.5" stroke-opacity="0.65" />

  <!-- Corner Notch Accents (Pattern Maker Notches) -->
  <path d="M 18 25 L 25 25 M 25 18 L 25 25" stroke="url(#tsViolet)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 110 25 L 103 25 M 103 18 L 103 25" stroke="url(#tsViolet)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 18 103 L 25 103 M 25 110 L 25 103" stroke="url(#tsViolet)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 110 103 L 103 103 M 103 110 L 103 103" stroke="url(#tsViolet)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Monogram T & S -->
  <g id="brand-monogram">
    <!-- Letter T -->
    <path d="M 21 36 L 55 36 C 56.5 36 57.5 37 57.5 38.5 L 57.5 45.5 C 57.5 47 56.5 48 55 48 L 44.5 48 L 44.5 87 C 44.5 89 43.5 90 41.5 90 L 34.5 90 C 32.5 90 31.5 89 31.5 87 L 31.5 48 L 21 48 C 19.5 48 18.5 47 18.5 45.5 L 18.5 38.5 C 18.5 37 19.5 36 21 36 Z" fill="url(#tsViolet)" />
    <!-- Letter T Highlight -->
    <path d="M 21 36 L 55 36 L 55 39.5 L 21 39.5 Z" fill="#ffffff" opacity="0.4" />

    <!-- Ampersand & (Sewing Thread Knot & Loop) -->
    <path d="M 64.5 59 C 62 55.5 59.5 52 63 47 C 65.5 43.5 70.5 44 70 48.5 C 69.5 52.5 64.5 57 59.5 62 C 54 67.5 51 73 54.5 78.5 C 58 84 66 83.5 70 78 C 72 75.5 74 72 78 70 L 80 72.5 C 75.5 76.5 73 81.5 68.5 84.5 C 62.5 88.5 51 88 47 80 C 43.5 72.5 48 64 54.5 58 C 58.5 54.5 62.5 50 62 46.5 C 61.5 43 58.5 43 56.5 45.5 C 54 48.5 55 53 58 56.5 Z" fill="url(#tsGold)" filter="url(#goldGlow)" />

    <!-- Letter S -->
    <path d="M 97 44.5 C 94 39 88.5 36 81.5 36 C 70.5 36 67 42.5 67 48 C 67 58.5 95 55 95 70.5 C 95 78.5 88 86 76 86 C 68 86 62 82.5 59 76 L 66.5 71.5 C 68.5 75.5 72 78.5 76.5 78.5 C 81 78.5 85 75.5 85 71 C 85 61 57 63.5 57 48 C 57 39 65 29.5 81.5 29.5 C 91.5 29.5 99 34.5 102.5 42 Z" fill="url(#tsCyan)" />
    <!-- Letter S Highlight -->
    <path d="M 81.5 29.5 C 91.5 29.5 99 34.5 102.5 42 L 97 44.5 C 94 40.5 88.5 37.5 81.5 37.5 C 75 37.5 70 40 68 44 Z" fill="#ffffff" opacity="0.3" />

    <!-- Sewing Needle & Flowing Stitch Thread along bottom -->
    <path d="M 24 98 Q 64 104 96 98" fill="none" stroke="url(#tsGold)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" />
    <!-- Needle Shape -->
    <path d="M 96 98 L 105 96 L 98 97 Z" fill="url(#tsGold)" />
    <!-- Needle Eye / Thread Sparkle -->
    <polygon points="105,96 108,92 109,96 113,97 109,98 108,102 107,98 103,97" fill="#fef08a" />
